<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Forgot Password | Cara</title>

    <link rel="icon" href="images/favicon.jpg" />

    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="toast.css" />
    <link rel="stylesheet" href="forgotPassword.css" />
    <link rel="manifest" href="/manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js');
      });
    }
  </script>
  <meta name="description" content="Cara - The best ecommerce store for modern fashion and clothing.">
    <script type="module" src="js/config.js"></script>
</head>

  <body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- HEADER -->
    <section id="header">
      <a href="index.html" aria-label="Cara Home"><img id="siteLogo" src="images/Dlogo.png" alt="Cara Logo" />
      </a>
      <div>
        <ul id="navbar">
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="blog.html">Blog</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="login.html" id="login-btn">Login</a></li>
          <li>
            <button class="theme-toggle" id="themeToggleDesktop" aria-label="Toggle dark mode">
              <i class="ri-moon-line" id="themeIcon"></i>
            </button>
          </li>
          <li class="nav-close"><a href="javascript:void(0)" id="close" aria-label="Close menu"><i class="fa-solid fa-xmark"></i></a></li>
        </ul>
      </div>
      <div class="mobile">
        <a href="login.html" aria-label="Login"><i class="ri-user-3-line"></i></a>
        <i class="fas fa-outdent" id="bar" role="button" aria-label="Open menu" aria-expanded="false" tabindex="0"></i>
      </div>
    </section>
<main id="main-content">

    <!-- FORGOT SECTION -->
    <section id="forgot-section">
      <div class="auth-card">
        <a href="index.html" class="back-button">&#8592; Back to Shop</a>

        <h1>Forgot Password</h1>

        <p class="subtitle">Enter your email and we'll send you a reset link 🔒</p>

        <form id="forgotForm" novalidate>
          <!-- EMAIL -->
          <div class="form-group">
            <label for="forgotEmail">Email Address</label>
            <input
              type="email"
              id="forgotEmail"
              name="email"
              placeholder="Enter registered email address"
              autocomplete="email"
              required
            />
            <span class="error-message" id="forgotEmailError" role="alert"></span>
          </div>

          <!-- BUTTON -->
          <button type="submit" class="btn-primary">SEND RESET LINK</button>
          <p id="forgotMessage" style="font-size: 0.85rem; margin-top: 12px; text-align: center;"></p>
        </form>

        <!-- BACK TO LOGIN -->
        <div class="switch-auth">
          Remember your password?
          <a href="login.html">Login</a>
        </div>
      </div>
    </section>
  </main>
</body>

  <script type="module" src="app.js"></script>
  <script type="module" src="forgotPassword.js"></script>
</html>
