<!-- Back button -->
<a href="index.html" class="back-button">&#8592; Back to Shop</a>

<div class="login-box">
  <h1>Welcome Back!</h1>
  <p class="subtitle">Sign in to your account</p>

  <form id="loginForm" novalidate>

    <div class="input-group">
      <label for="loginEmail">Email Address</label>
      <input
        type="email"
        id="loginEmail"
        name="email"
        class="input-field"
        placeholder="Enter your email address"
        autocomplete="email"
        required
        aria-required="true"
        aria-describedby="emailError"
        aria-invalid="false"
      />
      <span class="error-message" id="emailError" role="alert"></span>
    </div>

    <div class="input-group">
      <label for="loginPassword">Password</label>
      <div class="password-wrapper">
        <input
          type="password"
          id="loginPassword"
          name="password"
          class="input-field"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
          aria-required="true"
          aria-describedby="passwordError"
          aria-invalid="false"
        />
        <button
          type="button"
          id="togglePassword"
          class="toggle_password"
          aria-label="Show password"
        >
          <i class="ri-eye-line" id="toggleIcon" aria-hidden="true"></i>
        </button>
      </div>
      <span class="error-message" id="passwordError" role="alert"></span>
    </div>

    <div class="remfor">
      <div class="remember">
        <input type="checkbox" id="rememberMe" name="rememberMe" />
        <label for="rememberMe">Remember me</label>
      </div>
      <a href="forgotPassword.html" class="forgot">Forgot Password?</a>
    </div>

    <!-- General form-level error -->
    <span
      class="error-message"
      id="formError"
      style="display:block; margin-bottom: 8px;"
    ></span>

    <!-- Captcha -->
    <div
      id="captcha-section"
      class="captcha-section"
      style="display: none; margin-bottom: 20px;"
    >
      <label>Security Check</label>

      <div class="captcha-row">
        <canvas id="captcha-canvas" width="150" height="40"></canvas>

        <button
          type="button"
          id="captcha-refresh"
          aria-label="Refresh Captcha"
        >
          <i class="ri-refresh-line"></i>
        </button>
      </div>

      <input
        type="text"
        id="captcha-input"
        class="input-field"
        placeholder="Enter the code above"
        autocomplete="off"
      />

      <span class="error-message" id="captchaError"></span>
    </div>

    <button type="submit" class="login-btn" id="loginSubmitBtn">
      <span>Sign In</span>
    </button>

  </form>

  <div class="signup-link">
    Don't have an account?
    <a href="register.html">Register</a>
  </div>
</div>
