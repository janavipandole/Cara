<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter Subscribe Toast - Cara Premium Component</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-wrapper">
    <header class="demo-header">
      <div class="logo"><i class="fa-solid fa-envelope"></i> CARA</div>
      <h1 class="demo-title">Newsletter Subscribe Toast</h1>
      <p class="demo-subtitle">Interactive Premium E-Commerce Component Demo</p>
    </header>
    
    <main class="demo-content">
      <div class="subscribe-container">
        <h3>Subscribe to Newsletter</h3>
        <form id="subForm" style="display:flex;gap:10px;margin-top:15px;">
          <input type="email" placeholder="Enter email" required class="search-input" style="flex:1;">
          <button type="submit" class="action-btn">Subscribe</button>
        </form>
        <div id="toastNotification" class="toast-card" style="display:none;">
          <i class="fa-solid fa-circle-check" style="color:#22c55e;"></i> Subscription Success!
        </div>
      </div>
    </main>
    
    <footer class="demo-footer">
      <p>Cara Premium Component Suite &copy; 2026</p>
    </footer>
  </div>
  <script src="index.js"></script>
</body>
</html>
