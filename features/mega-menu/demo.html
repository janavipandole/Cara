<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mega Menu Dropdown - Cara Premium Component</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-wrapper">
    <header class="demo-header">
      <div class="logo"><i class="fa-solid fa-bars"></i> CARA</div>
      <h1 class="demo-title">Mega Menu Dropdown</h1>
      <p class="demo-subtitle">Interactive Premium E-Commerce Component Demo</p>
    </header>
    
    <main class="demo-content">
      <nav class="nav-bar">
        <div class="menu-item">
          Shop Categories <i class="fa-solid fa-chevron-down"></i>
          <div class="mega-dropdown">
            <div class="mega-col">
              <h4>Mens</h4>
              <a href="#">Shirts</a><a href="#">Shoes</a>
            </div>
            <div class="mega-col">
              <h4>Womens</h4>
              <a href="#">Dresses</a><a href="#">Handbags</a>
            </div>
          </div>
        </div>
      </nav>
    </main>
    
    <footer class="demo-footer">
      <p>Cara Premium Component Suite &copy; 2026</p>
    </footer>
  </div>
  <script src="index.js"></script>
</body>
</html>
