<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Tracking UI Timeline - Cara Premium Component</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-wrapper">
    <header class="demo-header">
      <div class="logo"><i class="fa-solid fa-route"></i> CARA</div>
      <h1 class="demo-title">Order Tracking UI Timeline</h1>
      <p class="demo-subtitle">Interactive Premium E-Commerce Component Demo</p>
    </header>
    
    <main class="demo-content">
      <div class="tracking-container">
        <h3>Order #10243</h3>
        <div class="timeline">
          <div class="step completed">Placed <i class="fa-solid fa-circle-check"></i></div>
          <div class="step completed">Shipped <i class="fa-solid fa-circle-check"></i></div>
          <div class="step current">In Transit <i class="fa-solid fa-truck"></i></div>
          <div class="step">Delivered <i class="fa-solid fa-house"></i></div>
        </div>
      </div>
    </main>
    
    <footer class="demo-footer">
      <p>Cara Premium Component Suite &copy; 2026</p>
    </footer>
  </div>
  <script src="index.js"></script>
</body>
</html>
