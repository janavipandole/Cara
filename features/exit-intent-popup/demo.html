<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exit Intent Discount Popup - Cara Premium Component</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-wrapper">
    <header class="demo-header">
      <div class="logo"><i class="fa-solid fa-arrow-up-right-from-square"></i> CARA</div>
      <h1 class="demo-title">Exit Intent Discount Popup</h1>
      <p class="demo-subtitle">Interactive Premium E-Commerce Component Demo</p>
    </header>
    
    <main class="demo-content">
      <div class="exit-wrapper">
        <h3>Move mouse out of window to trigger Exit Popup</h3>
        <div id="exitPopup" class="modal-overlay" style="display:none;">
          <div class="modal-content text-center" style="text-align:center;">
            <h2>Don't Go!</h2>
            <p>Get 10% off your first purchase with coupon <strong>WELCOME10</strong>.</p>
            <button id="closeExitPopup" class="secondary-btn" style="margin-top:15px;">Okay</button>
          </div>
        </div>
      </div>
    </main>
    
    <footer class="demo-footer">
      <p>Cara Premium Component Suite &copy; 2026</p>
    </footer>
  </div>
  <script src="index.js"></script>
</body>
</html>
