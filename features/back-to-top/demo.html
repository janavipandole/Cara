<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smooth Back to Top FAB - Cara Premium Component</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-wrapper">
    <header class="demo-header">
      <div class="logo"><i class="fa-solid fa-arrow-up"></i> CARA</div>
      <h1 class="demo-title">Smooth Back to Top FAB</h1>
      <p class="demo-subtitle">Interactive Premium E-Commerce Component Demo</p>
    </header>
    
    <main class="demo-content">
      <div style="position:relative;">
        <div style="height:600px; padding:20px; overflow-y:scroll; border:1px solid var(--glass-border); border-radius:12px;" id="fabScrollArea">
          <h3>Scroll down to reveal FAB</h3>
          <p style="margin-top:400px;">FAB should be visible now.</p>
          <button id="backToTopFab" class="fab-btn" style="display:none;"><i class="fa-solid fa-arrow-up"></i></button>
        </div>
      </div>
    </main>
    
    <footer class="demo-footer">
      <p>Cara Premium Component Suite &copy; 2026</p>
    </footer>
  </div>
  <script src="index.js"></script>
</body>
</html>
