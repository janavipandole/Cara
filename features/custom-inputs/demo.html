<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Form Inputs - Cara Premium Component</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-wrapper">
    <header class="demo-header">
      <div class="logo"><i class="fa-solid fa-check-double"></i> CARA</div>
      <h1 class="demo-title">Accessible Form Inputs</h1>
      <p class="demo-subtitle">Interactive Premium E-Commerce Component Demo</p>
    </header>
    
    <main class="demo-content">
      <div class="inputs-container">
        <h3>Preferences</h3>
        <label class="custom-control checkbox">
          <input type="checkbox" checked>
          <span class="control-indicator"></span> Receive special promos
        </label>
        <br>
        <label class="custom-control radio" style="margin-top:15px;display:inline-block;">
          <input type="radio" name="freq" checked>
          <span class="control-indicator"></span> Daily Frequency
        </label>
      </div>
    </main>
    
    <footer class="demo-footer">
      <p>Cara Premium Component Suite &copy; 2026</p>
    </footer>
  </div>
  <script src="index.js"></script>
</body>
</html>
