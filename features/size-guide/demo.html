<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Size Guide Modal - Cara Premium Component</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha384-h/hnnw1Bi4nbpD6kE7nYfCXzovi622sY5WBxww8ARKwpdLj5kUWjRuyiXaD1U2JT" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-wrapper">
    <header class="demo-header">
      <div class="logo"><i class="fa-solid fa-ruler"></i> CARA</div>
      <h1 class="demo-title">Size Guide Modal</h1>
      <p class="demo-subtitle">Interactive Premium E-Commerce Component Demo</p>
    </header>
    
    <main class="demo-content">
      <div>
        <button id="openSizeGuide" class="action-btn">View Size Guide</button>
        <div id="sizeGuideModal" class="modal-overlay" style="display:none;">
          <div class="modal-content">
            <h3>Size Guide</h3>
            <table class="size-table">
              <tr><th>Size</th><th>Bust (in)</th><th>Waist (in)</th></tr>
              <tr><td>S</td><td>32-34</td><td>26-28</td></tr>
              <tr><td>M</td><td>35-37</td><td>29-31</td></tr>
              <tr><td>L</td><td>38-40</td><td>32-34</td></tr>
            </table>
            <button id="closeSizeGuide" class="secondary-btn" style="margin-top:15px;">Close</button>
          </div>
        </div>
      </div>
    </main>
    
    <footer class="demo-footer">
      <p>Cara Premium Component Suite &copy; 2026</p>
    </footer>
  </div>
  <script src="index.js"></script>
</body>
</html>
