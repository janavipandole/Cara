<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Filter/Sort Sidebar - Cara Premium Component</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha384-h/hnnw1Bi4nbpD6kE7nYfCXzovi622sY5WBxww8ARKwpdLj5kUWjRuyiXaD1U2JT" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-wrapper">
    <header class="demo-header">
      <div class="logo"><i class="fa-solid fa-sliders"></i> CARA</div>
      <h1 class="demo-title">Shop Filter/Sort Sidebar</h1>
      <p class="demo-subtitle">Interactive Premium E-Commerce Component Demo</p>
    </header>
    
    <main class="demo-content">
      <div>
        <button id="toggleFilter" class="action-btn">Toggle Filter Drawer</button>
        <div id="filterSidebar" class="filter-sidebar">
          <h3>Filters</h3>
          <div style="margin:20px 0;">
            <label>Price Range</label>
            <input type="range" min="0" max="1000" id="priceRange" style="width:100%;">
            <span id="priceVal">$500</span>
          </div>
          <button id="closeFilter" class="secondary-btn">Close</button>
        </div>
      </div>
    </main>
    
    <footer class="demo-footer">
      <p>Cara Premium Component Suite &copy; 2026</p>
    </footer>
  </div>
  <script src="index.js"></script>
</body>
</html>
