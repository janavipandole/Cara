<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery Thumbnails - Cara Premium Component</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-wrapper">
    <header class="demo-header">
      <div class="logo"><i class="fa-solid fa-photo-film"></i> CARA</div>
      <h1 class="demo-title">Image Gallery Thumbnails</h1>
      <p class="demo-subtitle">Interactive Premium E-Commerce Component Demo</p>
    </header>
    
    <main class="demo-content">
      <div class="gallery-wrapper">
        <img id="mainImage" src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" alt="Red Shoes" class="gallery-main">
        <div class="thumbnail-row">
          <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" class="thumb active">
          <img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=400" class="thumb">
          <img src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=400" class="thumb">
        </div>
      </div>
    </main>
    
    <footer class="demo-footer">
      <p>Cara Premium Component Suite &copy; 2026</p>
    </footer>
  </div>
  <script src="index.js"></script>
</body>
</html>
