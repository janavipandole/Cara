<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Free Shipping Bar - Cara Premium Component</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-wrapper">
    <header class="demo-header">
      <div class="logo"><i class="fa-solid fa-truck-fast"></i> CARA</div>
      <h1 class="demo-title">Dynamic Free Shipping Bar</h1>
      <p class="demo-subtitle">Interactive Premium E-Commerce Component Demo</p>
    </header>
    
    <main class="demo-content">
      <div class="shipping-card">
        <h3>Free Shipping Goal</h3>
        <p id="shippingMessage">Add items to reach free shipping.</p>
        <div class="progress-container"><div id="shippingProgress" class="progress-fill"></div></div>
        <button id="addTenDollars" class="action-btn" style="margin-top:15px;">Add $10 to Cart</button>
      </div>
    </main>
    
    <footer class="demo-footer">
      <p>Cara Premium Component Suite &copy; 2026</p>
    </footer>
  </div>
  <script src="index.js"></script>
</body>
</html>
